course_families:
  - title: Real-Time Systems
    description: Scheduling, timing analysis, real-time kernels, predictability, and applications of time-constrained computing.
  - title: Operating Systems
    description: Operating-system concepts, processes, concurrency, scheduling, memory, and systems implementation.
  - title: Software Engineering
    description: Software engineering methods, design, development processes, and advanced software-engineering topics.
  - title: Software Testing and Reliability
    description: Testing techniques, software reliability, dependable software, and quality evaluation.
  - title: Advanced and Selected Topics
    description: Advanced software engineering, selected mathematics topics, and specialized computing subjects.
  - title: Computing Foundations
    description: Graduate computing foundations represented in the CV by Computing I.
  - title: Social and Professional Context of Computing
    description: Social and professional dimensions of computing; taught as a shared course.

