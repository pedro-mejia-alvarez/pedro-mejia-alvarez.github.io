# -----------------------------------------------------------------------------
# Site identity
# -----------------------------------------------------------------------------
title: Pedro Mejia-Alvarez
first_name: Pedro
middle_name:
last_name: Mejia-Alvarez
email: pedro.mejia@cinvestav.mx
description: >-
  Academic website of Pedro Mejia-Alvarez, professor and researcher in real-time systems,
  artificial intelligence, software engineering, embedded systems, and dependable computing.
keywords: real-time systems, artificial intelligence, software engineering, research software, embedded systems
lang: en
icon: ⏱️
url: https://pedro-mejia-alvarez.github.io
baseurl: ""
last_updated: false
back_to_top: true

# -----------------------------------------------------------------------------
# al-folio v1.x runtime contract
# -----------------------------------------------------------------------------
theme: al_folio_core

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: true
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# -----------------------------------------------------------------------------
# Layout and search — safe to change later without restructuring content
# -----------------------------------------------------------------------------
navbar_fixed: true
footer_fixed: false
max_width: 1050px
search_enabled: true
socials_in_search: false
posts_in_search: false
bib_search: true

enable_darkmode: true
enable_navbar_social: false
enable_publication_thumbnails: false
enable_math: false
enable_medium_zoom: false
enable_masonry: false
enable_project_categories: false
enable_progressbar: true
max_author_limit: 8
more_authors_animation_delay: 10

# -----------------------------------------------------------------------------
# Collections and Jekyll settings
# -----------------------------------------------------------------------------
collections:
  books:
    output: true
    permalink: /books/:name/
  projects:
    output: true
    permalink: /projects/:name/
  teachings:
    output: true
    permalink: /teaching/:name/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

include:
  - _pages

exclude:
  - docs
  - scripts
  - README.md
  - SITE-CONTENT-SOURCE-NOTES.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .worktrees

keep_files:
  - CNAME
  - .nojekyll

sass:
  style: compressed

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-feed
  - jekyll-get-json
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter

# Do not re-minify Tailwind output; this mirrors the v1.x safety rule.
jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ["robots.txt"]

# -----------------------------------------------------------------------------
# Publications
# -----------------------------------------------------------------------------
scholar:
  last_name: [Mejia-Alvarez, Mejia Alvarez, Mejia]
  first_name: [Pedro, P.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: type, year
  group_order: ascending, descending
  type_order: [book, incollection, article, inproceedings]
  type_names:
    book: Books
    incollection: Book Chapters
    article: Journal Papers
    inproceedings: Conference Papers

# Avoid external citation badges until IDs/services are intentionally configured.
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

filtered_bibtex_keywords:
  - abstract
  - annotation
  - bibtex_show
  - code
  - doi
  - pdf
  - preview
  - selected
  - website

# -----------------------------------------------------------------------------
# Structured CV
# -----------------------------------------------------------------------------
jekyll_get_json:
  - data: resume
    json: assets/json/resume.json

jsonresume:
  - basics
  - education
  - work
  - awards
  - publications
  - projects
  - volunteer

# -----------------------------------------------------------------------------
# Contact, repositories, analytics, and external services
# -----------------------------------------------------------------------------
external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

analytics:
  google:
  cloudflare:
enable_simple_analytics: false
enable_cookie_consent: false

giscus:
  repo: ""

imagemagick:
  enabled: false
lazy_loading_images: true

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank

# Minimal CDN entries needed by al-folio's icon and navigation runtime.
third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uhv4NgT+vNdyVFepi7Q0c="
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css"
    version: "7.2.0"
  academicons:
    integrity:
      css: "sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw="
    url:
      css: "https://cdn.jsdelivr.net/npm/academicons@{{version}}/css/academicons.min.css"
    version: "1.9.5"
  scholar-icons:
    integrity:
      css: "sha256-VY3hHVj/hNX3fYG6wtbA6TcKJQl7+FthzGSyIB64klY="
    url:
      css: "https://cdn.jsdelivr.net/npm/scholar-icons@{{version}}/css/scholar-icons.css"
    version: "1.0.3"
  vanilla-back-to-top:
    integrity:
      js: "sha256-uMJJ3EoTyfRBoTbR+lrfu1uRQ87RZG8AR3cVNuQVeFg="
    url:
      js: "https://cdn.jsdelivr.net/npm/vanilla-back-to-top@{{version}}/dist/vanilla-back-to-top.min.js"
    version: "7.2.1"
